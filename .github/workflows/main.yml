
name: Update BLOOD GARDEN Cards

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  generate-cards:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        run: python scripts/cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/language-scan.svg
          git add assets/commit-activity.svg

          git diff --cached --quiet || (
            git commit -m "chore: update blood garden cards"
            git push
          )
